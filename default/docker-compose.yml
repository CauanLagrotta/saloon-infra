    container_name: gateway-server
    environment:
      SPRING_APPLICATION_NAME: "gateway-server-service"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/

    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - cauanlagrottadev

networks:
  cauanlagrottadev:
    driver: "bridge"
