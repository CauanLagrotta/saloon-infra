  gateway-server:
    image: "cauanlagrottadev/saloon-gateway-server:v1"
    ports:
      - "5000:5000"
    healthcheck:
      test: "curl --fail --silent gateway-server:5000/actuator/health/readiness | grep UP || exit 1"
